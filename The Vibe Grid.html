<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlipPlay - The Vibe Grid</title>
  <link rel="stylesheet" href="./src/output.css" />
  <script src="./script.js" defer></script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased">
  
  <header class="bg-white shadow-sm sticky top-0 z-50">
    <nav class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
      <a href="index.html" class="text-2xl font-bold text-teal-600">FlipPlay</a>

      <ul class="hidden md:flex items-center gap-6 text-sm font-semibold text-slate-600">
        <li><a href="index.html#hero" class="hover:text-teal-600 transition">Beranda</a></li>
        <li><a href="index.html#fitur" class="hover:text-teal-600 transition">Layanan</a></li>
        <li><a href="The Vibe Grid.html" class="text-teal-600 transition">The Vibe Grid</a></li>
      </ul>

      <a href="index.html#kontak" class="hidden md:inline-block bg-teal-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-teal-700 transition">
        Coba Gratis
      </a>

      <button id="hamburger-btn" class="md:hidden text-slate-700 hover:text-teal-600 p-2" aria-label="Buka Menu">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
    </nav>
  </header>

  <div id="mobile-overlay" class="fixed inset-0 bg-black/50 z-50 hidden md:hidden transition-opacity"></div>
  <aside id="mobile-sidebar" class="fixed top-0 right-0 w-64 h-full bg-white z-50 shadow-2xl transform translate-x-full transition-transform duration-300 ease-in-out md:hidden flex flex-col justify-between p-6">
    <div>
      <div class="flex justify-between items-center border-b border-slate-100 pb-4 mb-6">
        <span class="text-xl font-bold text-teal-600">FlipPlay</span>
        <button id="close-btn" class="text-slate-400 hover:text-slate-600 p-1" aria-label="Tutup Menu">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      <nav class="flex flex-col gap-4 text-slate-700 font-semibold text-base">
        <a href="index.html#hero" class="mobile-link hover:text-teal-600 p-2 rounded-lg hover:bg-teal-50 transition">Beranda</a>
        <a href="index.html#fitur" class="mobile-link hover:text-teal-600 p-2 rounded-lg hover:bg-teal-50 transition">Layanan</a>
        <a href="The Vibe Grid.html" class="mobile-link text-teal-600 p-2 rounded-lg bg-teal-50 transition">The Vibe Grid</a>
      </nav>
    </div>
  </aside>

  <main class="max-w-7xl mx-auto px-6 py-10 md:py-14">
    <div class="mb-8 flex flex-col md:flex-row md:items-end justify-between gap-4">
      <div>
        <p class="text-xs font-semibold uppercase tracking-[0.2em] text-teal-600">Discover</p>
        <h1 class="mt-2 text-3xl md:text-4xl font-extrabold text-slate-900">The Vibe Grid</h1>
      </div>
      <span class="self-start md:self-auto rounded-full border border-teal-200 bg-teal-50 px-3 py-1 text-xs font-semibold text-teal-700">
        Live from Kitsu API
      </span>
    </div>

    <!-- Controls Section: Unified Search & Aura-Based Discovery -->
    <div class="mb-8 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row gap-6 items-center justify-between">
      <div class="w-full md:w-1/2">
        <label for="search-input" class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Unified Search</label>
        <input 
          type="text" 
          id="search-input" 
          placeholder="Cari judul anime..." 
          class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm transition"
        />
      </div>

      <div class="w-full md:w-auto">
        <span class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Filter Genre</span>
        <div class="flex flex-wrap gap-2" id="aura-buttons">
          <button data-aura="all" class="aura-btn px-4 py-2 text-xs font-semibold rounded-xl bg-teal-600 text-white transition hover:bg-teal-700">Semua</button>
        </div>
      </div>
    </div>

    <!-- Loading State -->
    <div id="loading-state" class="hidden my-12 text-center text-slate-500 font-medium">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-teal-600 border-t-transparent mb-3"></div>
      <p>Mengambil data dari Kitsu API...</p>
    </div>

    <!-- Error State -->
    <div id="error-state" class="hidden my-8 rounded-2xl border border-red-200 bg-red-50 p-6 text-center text-red-700">
      <p id="error-message">Gagal memuat data anime dari API.</p>
      <button id="retry-button" type="button" class="mt-4 rounded-lg bg-teal-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-teal-700">
        Coba Lagi
      </button>
    </div>

    <!-- Anime Grid Container -->
    <section id="anime-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-6"></section>
  </main>

</body>
</html>
